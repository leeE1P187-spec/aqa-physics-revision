<title>AQA Physics Revision</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: graph-paper ground, one centred working column, tab bar of study modes, topic chips as the shared filter */
:root {
  --bg: #eef1f6;
  --grid: rgba(38, 67, 233, 0.07);
  --surface: #ffffff;
  --surface-2: #f5f7fb;
  --ink: #14213d;
  --muted: #5b6478;
  --line: #d6dce8;
  --accent: #2643e9;
  --accent-ink: #ffffff;
  --accent-soft: #e3e8ff;
  --amber: #b9770e;
  --amber-soft: #fff3d6;
  --good: #1d8a4e;
  --good-soft: #dff3e7;
  --bad: #c43c3c;
  --bad-soft: #fbe3e3;
  /* system faces only, so the app needs no network once installed */
  --font-display: ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-body: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1322; --grid: rgba(123, 140, 255, 0.07); --surface: #151d31; --surface-2: #1b2540;
    --ink: #e6eaf3; --muted: #9ba5ba; --line: #283352; --accent: #7d8eff; --accent-ink: #0d1322;
    --accent-soft: #232e58; --amber: #f2b648; --amber-soft: #3a2f16; --good: #4cc483; --good-soft: #163626;
    --bad: #f07575; --bad-soft: #3d1c22; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1322; --grid: rgba(123, 140, 255, 0.07); --surface: #151d31; --surface-2: #1b2540;
  --ink: #e6eaf3; --muted: #9ba5ba; --line: #283352; --accent: #7d8eff; --accent-ink: #0d1322;
  --accent-soft: #232e58; --amber: #f2b648; --amber-soft: #3a2f16; --good: #4cc483; --good-soft: #163626;
  --bad: #f07575; --bad-soft: #3d1c22; color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background-color: var(--bg);
  background-image:
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 24px 24px;
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.55;
  min-height: 100vh;
}
.wrap {
  max-width: 860px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 56px;
  display: flex; flex-direction: column; gap: 18px;
}
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; line-height: 1.2; }
h1 { font-size: 1.7rem; letter-spacing: -0.01em; }
h2 { font-size: 1.25rem; }
h3 { font-size: 1.02rem; }
p { margin: 0; }
.muted { color: var(--muted); }
.mono { font-family: var(--font-mono); }
.eyebrow { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 600; }
header.top { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.spec { font-family: var(--font-mono); font-size: 0.78rem; color: var(--muted); }
.streak { font-family: var(--font-mono); font-size: 0.82rem; padding: 4px 10px; border-radius: 999px; background: var(--amber-soft); color: var(--amber); font-weight: 600; }

nav.tabs { display: flex; gap: 4px; overflow-x: auto; padding: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); scrollbar-width: none; }
nav.tabs a { flex: 0 0 auto; text-decoration: none; color: var(--muted); font-weight: 600; font-size: 0.88rem; padding: 8px 12px; border-radius: 7px; }
nav.tabs a:hover { color: var(--ink); background: var(--surface-2); }
nav.tabs a[aria-current="page"] { background: var(--accent); color: var(--accent-ink); }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.between { justify-content: space-between; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }

button, .btn { font: inherit; cursor: pointer; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); padding: 9px 14px; font-weight: 600; font-size: 0.9rem; }
button:hover { border-color: var(--accent); }
button:focus-visible, a:focus-visible, input:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
button.ghost { background: transparent; }
button:disabled { opacity: 0.5; cursor: default; }
.chip { padding: 6px 11px; font-size: 0.82rem; border-radius: 999px; font-weight: 600; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
@media (max-width: 700px) {
  .chips { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; margin-inline: -18px; padding-inline: 18px; padding-block: 2px; -webkit-overflow-scrolling: touch; }
  .chips::-webkit-scrollbar { display: none; }
  .chips .chip { flex: 0 0 auto; }
}
.chip[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.badge { display: inline-block; font-size: 0.68rem; font-weight: 700; letter-spacing: 0.05em; padding: 2px 7px; border-radius: 5px; background: var(--amber-soft); color: var(--amber); vertical-align: middle; }
.badge.topic { background: var(--accent-soft); color: var(--accent); }

.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.stat { background: var(--surface-2); border-radius: 8px; padding: 10px 12px; }
.stat b { display: block; font-family: var(--font-display); font-size: 1.5rem; font-variant-numeric: tabular-nums; }
.stat span { font-size: 0.78rem; color: var(--muted); }

.topic-card { text-align: left; display: flex; flex-direction: column; gap: 8px; padding: 14px; font-weight: 400; }
.topic-card .t-head { display: flex; gap: 8px; align-items: baseline; }
.topic-card .num { font-family: var(--font-mono); color: var(--muted); font-size: 0.8rem; }
.topic-card .name { font-family: var(--font-display); font-weight: 600; font-size: 1rem; }
.meter { display: grid; grid-template-columns: 52px 1fr 40px; gap: 8px; align-items: center; font-size: 0.75rem; color: var(--muted); }
.bar { height: 6px; background: var(--surface-2); border-radius: 3px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); border-radius: 3px; }
.bar.q i { background: var(--amber); }
.meter .v { text-align: right; font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

.flash { min-height: 230px; display: flex; flex-direction: column; justify-content: center; gap: 12px; padding: 26px; cursor: pointer; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); text-align: left; font-weight: 400; font-size: 1.05rem; width: 100%; }
.flash .side { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 600; }
.flash .q { font-family: var(--font-display); font-size: 1.25rem; font-weight: 600; }
.flash .a { border-top: 1px dashed var(--line); padding-top: 12px; color: var(--ink); }
.rate { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.rate button { padding: 12px 6px; }
.rate .again { border-color: var(--bad); color: var(--bad); }
.rate .ok { border-color: var(--amber); color: var(--amber); }
.rate .got { border-color: var(--good); color: var(--good); }
.kbd { font-family: var(--font-mono); font-size: 0.7rem; color: var(--muted); font-weight: 400; display: block; }

.options { display: flex; flex-direction: column; gap: 8px; }
.opt { text-align: left; font-weight: 500; display: flex; gap: 10px; padding: 12px 14px; }
.opt .k { font-family: var(--font-mono); color: var(--muted); }
.opt:disabled { opacity: 1; cursor: default; }
@media (hover: none) { .kbd { display: none !important; } }
.opt.right { background: var(--good-soft); border-color: var(--good); }
.opt.wrong { background: var(--bad-soft); border-color: var(--bad); }
.feedback { border-radius: 8px; padding: 12px 14px; }
.feedback.good { background: var(--good-soft); }
.feedback.bad { background: var(--bad-soft); }
.feedback b { display: block; margin-bottom: 4px; }
.progress { height: 4px; background: var(--surface-2); border-radius: 2px; overflow: hidden; }
.progress i { display: block; height: 100%; background: var(--accent); transition: width .2s; }

.givens { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.givens li { display: flex; justify-content: space-between; gap: 12px; padding: 8px 12px; background: var(--surface-2); border-radius: 7px; }
.givens .val { font-family: var(--font-mono); font-weight: 600; white-space: nowrap; }
.eqline { font-family: var(--font-mono); font-size: 1.05rem; font-weight: 600; color: var(--accent); }
.answer-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.answer-row input { font: inherit; font-family: var(--font-mono); font-size: 17px; padding: 9px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); width: 180px; max-width: 100%; }
.unit { font-family: var(--font-mono); color: var(--muted); }
.steps { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 4px; }
.steps .mono { font-weight: 600; }
label.check { display: inline-flex; gap: 8px; align-items: center; font-size: 0.88rem; cursor: pointer; }

.eq-item { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr); gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); }
.eq-item:first-of-type { border-top: 0; }
.eq-item .e { font-family: var(--font-mono); font-weight: 600; font-size: 1rem; color: var(--accent); cursor: pointer; }
.eq-item .e.hidden { filter: blur(7px); user-select: none; }
.sym { font-size: 0.82rem; color: var(--muted); }
.sym .mono { color: var(--ink); }

details.prac { border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
details.prac summary { cursor: pointer; padding: 14px 16px; display: flex; gap: 10px; align-items: center; justify-content: space-between; font-family: var(--font-display); font-weight: 600; list-style: none; }
details.prac summary::-webkit-details-marker { display: none; }
details.prac summary::after { content: "+"; font-family: var(--font-mono); color: var(--muted); }
details.prac[open] summary::after { content: "−"; }
details.prac .body { padding: 0 16px 16px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
details.prac ol, details.prac ul { margin: 0; padding-left: 20px; }
.vars { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: 0.9rem; }
.vars dt { font-weight: 700; font-family: var(--font-mono); color: var(--accent); }
.vars dd { margin: 0; }
.empty { text-align: center; padding: 30px 10px; color: var(--muted); }
.mistake-list { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 8px; font-size: 0.9rem; }

@media (max-width: 560px) {
  .stats { grid-template-columns: 1fr 1fr 1fr; }
  .stat b { font-size: 1.2rem; }
  .eq-item { grid-template-columns: 1fr; gap: 4px; }
  .flash { padding: 20px; }
  h1 { font-size: 1.4rem; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <div class="spec">AQA GCSE Physics 8463 · Higher tier</div>
      <h1>Physics Revision</h1>
    </div>
    <span class="streak" id="streak">Day streak: 0</span>
  </header>
  <nav class="tabs" id="tabs">
    <a href="#home">Overview</a>
    <a href="#cards">Flashcards</a>
    <a href="#quiz">Quiz</a>
    <a href="#calc">Calculations</a>
    <a href="#equations">Equations</a>
    <a href="#practicals">Required practicals</a>
  </nav>
  <main id="app" class="panel"><p class="muted">Loading questions…</p></main>
  <p class="muted" style="font-size:0.78rem">Progress is saved in this browser on this device only. Equations use g = 9.8 N/kg, as on the AQA equation sheet.</p>
</div>

<script>
/* AQA GCSE Physics (8463) revision content - separate science, Higher tier focus.
   Defines window.PHYSICS_DATA. Items flagged ho:true are Higher tier only. */
window.PHYSICS_DATA = {
  topics: [
    /* ============================== 1 ENERGY ============================== */
    {
      id: "energy", num: 1, name: "Energy",
      cards: [
        { q: "State the principle of conservation of energy.", a: "Energy cannot be created or destroyed. It can only be transferred usefully, stored or dissipated, so the total energy of a closed system stays the same.", ho: false },
        { q: "Name some of the energy stores.", a: "Kinetic, gravitational potential, elastic potential, thermal, chemical, magnetic, electrostatic and nuclear.", ho: false },
        { q: "Name the four ways energy can be transferred between stores.", a: "Mechanically (a force moving through a distance), electrically (charge moving through a potential difference), by heating (due to a temperature difference) and by radiation (e.g. light and sound waves).", ho: false },
        { q: "Write the equation for kinetic energy and calculate the kinetic energy of a 1200 kg car travelling at 20 m/s.", a: "E_k = ½ m v². E_k = ½ × 1200 × 20² = 240 000 J (240 kJ).", ho: false },
        { q: "Write the equation for gravitational potential energy and calculate the energy gained by a 5 kg mass lifted 3 m (g = 9.8 N/kg).", a: "E_p = m g h. E_p = 5 × 9.8 × 3 = 147 J.", ho: false },
        { q: "What equation gives the energy stored in a stretched spring, and what condition applies?", a: "E_e = ½ k e², where k is the spring constant and e the extension. It applies only within the limit of proportionality (the spring has not been over-stretched).", ho: false },
        { q: "Define specific heat capacity.", a: "The amount of energy needed to raise the temperature of 1 kg of a substance by 1 °C. Used in ΔE = m c Δθ.", ho: false },
        { q: "Define power and give the unit.", a: "Power is the rate of energy transfer (or rate of doing work). Unit: watt (W), where 1 W = 1 J/s.", ho: false },
        { q: "How is efficiency calculated, and why can it never be more than 100%?", a: "Efficiency = useful output energy transfer ÷ total input energy transfer (or useful power out ÷ total power in). It cannot exceed 1 (100%) because some energy is always dissipated, and energy is never created.", ho: false },
        { q: "What happens to wasted energy?", a: "It is dissipated: transferred to the surroundings (mostly as thermal energy), where it is spread out and is less useful.", ho: false },
        { q: "Give two ways to reduce unwanted energy transfers in a machine.", a: "Lubrication (reduces friction between moving parts) and thermal insulation (reduces energy transferred by heating to the surroundings).", ho: false },
        { q: "How does the thermal conductivity and thickness of a wall affect the rate of energy transfer through it by conduction?", a: "A lower thermal conductivity gives a lower rate of energy transfer. A thicker wall also reduces the rate of energy transfer.", ho: false },
        { q: "What is the difference between renewable and non-renewable energy resources? Give an example of each.", a: "Renewable resources are replenished as they are used (e.g. wind, solar, tidal, hydroelectric). Non-renewable resources will run out (e.g. coal, oil, gas, nuclear fuel).", ho: false },
        { q: "Why are wind and solar power described as unreliable?", a: "Their output depends on the weather (wind speed, sunshine) and time of day, which cannot be controlled.", ho: false }
      ],
      mcq: [
        { q: "A 0.5 kg ball moves at 4 m/s. What is its kinetic energy?", options: ["1 J", "8 J", "4 J", "16 J"], answer: 2, why: "E_k = ½ m v² = ½ × 0.5 × 4² = 4 J. 8 J comes from forgetting the ½; 1 J comes from forgetting to square the speed." },
        { q: "How much energy is needed to raise the temperature of 2 kg of water by 10 °C? (specific heat capacity of water = 4200 J/kg °C)", options: ["8 400 J", "84 000 J", "840 J", "420 000 J"], answer: 1, why: "ΔE = m c Δθ = 2 × 4200 × 10 = 84 000 J." },
        { q: "A motor receives 500 J of energy and wastes 150 J. What is its efficiency?", options: ["30%", "35%", "350%", "70%"], answer: 3, why: "Useful output = 500 − 150 = 350 J. Efficiency = 350 ÷ 500 = 0.70 = 70%. 30% is the wasted fraction, not the efficiency." },
        { q: "A crane does 4800 J of work in 8 s. What is its power?", options: ["600 W", "60 W", "6000 W", "38 400 W"], answer: 0, why: "P = W ÷ t = 4800 ÷ 8 = 600 W. 38 400 W comes from multiplying instead of dividing." },
        { q: "Which change would reduce the rate of energy transfer through the walls of a house?", options: ["Using a material with a higher thermal conductivity", "Making the walls thinner", "Using a material with a lower thermal conductivity", "Removing the insulation from the cavity"], answer: 2, why: "A lower thermal conductivity means energy is conducted more slowly. Thicker walls would also help; thinner walls or removing insulation would increase the rate." },
        { q: "Which of these is a renewable energy resource?", options: ["Coal", "Natural gas", "Uranium", "Tidal power"], answer: 3, why: "Tides are continually replenished. Coal, gas and uranium are finite, non-renewable fuels." },
        { q: "A skydiver falls at a constant terminal velocity. The energy lost from the gravitational potential store is mainly transferred to:", options: ["the kinetic store of the skydiver", "the thermal stores of the air and the skydiver", "the elastic store of the parachute", "no store, because it is lost completely"], answer: 1, why: "Kinetic energy is constant at terminal velocity, so the energy goes to the thermal stores through work done against air resistance. Energy is never lost completely." },
        { q: "A spring with spring constant 40 N/m is stretched by 0.10 m (within its limit of proportionality). How much energy is stored?", options: ["0.2 J", "0.4 J", "2 J", "4 J"], answer: 0, why: "E_e = ½ k e² = ½ × 40 × 0.10² = 0.2 J. 0.4 J comes from forgetting the ½." },
        { q: "A 2 kg mass is lifted 5 m. What gravitational potential energy does it gain? (g = 9.8 N/kg)", options: ["10 J", "49 J", "98 J", "196 J"], answer: 2, why: "E_p = m g h = 2 × 9.8 × 5 = 98 J." }
      ]
    },

    /* ============================ 2 ELECTRICITY ============================ */
    {
      id: "electricity", num: 2, name: "Electricity",
      cards: [
        { q: "Define electric current and give the equation linking charge, current and time.", a: "Current is the rate of flow of electric charge. Q = I t (charge in coulombs, C; current in amperes, A; time in seconds, s).", ho: false },
        { q: "Define potential difference.", a: "The energy transferred per unit charge passing between two points in a circuit. E = Q V; 1 volt = 1 joule per coulomb.", ho: false },
        { q: "How are an ammeter and a voltmeter connected in a circuit?", a: "An ammeter is connected in series with the component. A voltmeter is connected in parallel across the component.", ho: false },
        { q: "State the rules for current, potential difference and resistance in a series circuit.", a: "The current is the same everywhere. The supply pd is shared between the components. The total resistance is the sum of the individual resistances.", ho: false },
        { q: "State the rules for a parallel circuit.", a: "The pd across each branch equals the supply pd. The total current is the sum of the currents in the branches. The total resistance is less than the smallest individual resistance.", ho: false },
        { q: "What is an ohmic conductor?", a: "A conductor whose current is directly proportional to the pd across it, provided its temperature is constant. Its resistance is constant, so its I–V graph is a straight line through the origin.", ho: false },
        { q: "Explain the shape of the I–V graph for a filament lamp.", a: "As current rises the filament gets hotter, the ions vibrate more and collide with electrons more often, so resistance increases. The graph curves and flattens.", ho: false },
        { q: "Describe the I–V behaviour of a diode.", a: "Current flows in one direction only (forward). In the reverse direction the resistance is very high, so almost no current flows.", ho: false },
        { q: "How do the resistances of an LDR and a thermistor change, and give a use of each.", a: "LDR: resistance decreases as light intensity increases (e.g. automatic night lights). Thermistor: resistance decreases as temperature increases (e.g. thermostats).", ho: false },
        { q: "State the frequency and potential difference of UK mains, and the difference between a.c. and d.c.", a: "UK mains is 50 Hz at about 230 V. Alternating current (a.c.) repeatedly changes direction; direct current (d.c.) flows in one direction only.", ho: false },
        { q: "Name the three wires in a mains cable, their colours, and their potentials.", a: "Live (brown): about 230 V. Neutral (blue): about 0 V. Earth (green and yellow stripes): 0 V, a safety wire.", ho: false },
        { q: "How does the earth wire protect the user?", a: "If a fault connects the live wire to the metal casing, a large current flows through the earth wire, which melts the fuse (or trips the circuit breaker) and disconnects the appliance.", ho: false },
        { q: "Give two equations for electrical power and calculate the power of a device using 5 A at 230 V.", a: "P = V I and P = I² R. P = 230 × 5 = 1150 W.", ho: false },
        { q: "Why does the National Grid use step-up and step-down transformers?", a: "Step-up transformers raise the pd and so reduce the current for the same power. A lower current means less energy is wasted as heat in the cables (P = I² R). Step-down transformers then reduce the pd to safe levels for use.", ho: false },
        { q: "Explain how static charge builds up when two insulators are rubbed together.", a: "Electrons are transferred from one surface to the other. The surface that gains electrons becomes negatively charged and the surface that loses them becomes positively charged. Like charges repel; unlike charges attract.", ho: false },
        { q: "What is an electric field, and how is it drawn? (physics only)", a: "A region where a charged object experiences a non-contact force. Field lines point away from a positive charge and towards a negative charge; closer lines mean a stronger field.", ho: false }
      ],
      mcq: [
        { q: "A current of 3 A flows for 20 s. How much charge flows?", options: ["6.7 C", "60 C", "23 C", "17 C"], answer: 1, why: "Q = I t = 3 × 20 = 60 C." },
        { q: "What current flows through a 12 Ω resistor when the pd across it is 6 V?", options: ["72 A", "2 A", "18 A", "0.5 A"], answer: 3, why: "I = V ÷ R = 6 ÷ 12 = 0.5 A. 2 A comes from dividing the wrong way round." },
        { q: "A 10 Ω resistor and a 20 Ω resistor are connected in parallel. What is the total resistance?", options: ["6.7 Ω", "15 Ω", "30 Ω", "10 Ω"], answer: 0, why: "In parallel the total resistance is less than the smallest resistor. 1/R = 1/10 + 1/20 = 3/20, so R = 6.7 Ω. 30 Ω is the series value." },

        { q: "Light passes from air into glass. Which quantity does not change?", options: ["Speed", "Wavelength", "Frequency", "Direction of travel (along the normal)"], answer: 2, why: "The frequency is set by the source. The speed and wavelength both decrease in glass." },
        { q: "A sonar pulse returns to a ship after 0.80 s. Sound travels at 1500 m/s in water. How deep is the water?", options: ["1200 m", "300 m", "1875 m", "600 m"], answer: 3, why: "The pulse travels down and back, so distance = 1500 × 0.80 ÷ 2 = 600 m. 1200 m forgets to halve." },
        { q: "S-waves from an earthquake are not detected on the opposite side of the Earth. Why?", options: ["The Earth's core is too dense for any waves", "The outer core is liquid and S-waves cannot travel through liquids", "S-waves are absorbed by the atmosphere", "S-waves travel faster than P-waves"], answer: 1, why: "S-waves are transverse and travel only through solids. Their absence behind the core shows part of the core is liquid." },
        { q: "Which of these EM waves is ionising?", options: ["Infrared", "Microwaves", "Gamma rays", "Visible light"], answer: 2, why: "Gamma rays (and X-rays and high-frequency ultraviolet) can remove electrons from atoms and damage cells." },
        { q: "An object 4 mm high produces an image 12 mm high through a lens. What is the magnification?", options: ["3", "8", "0.33", "48"], answer: 0, why: "Magnification = image height ÷ object height = 12 ÷ 4 = 3. 0.33 is the inverse." },
        { q: "A green leaf is viewed in pure red light. What colour does it appear?", options: ["Green", "Black", "Red", "White"], answer: 1, why: "The leaf reflects only green light and absorbs red, so no light reaches the eye and it looks black." },
        { q: "A ray hits a plane mirror at 30° to the surface of the mirror. What is the angle of reflection?", options: ["30°", "90°", "60°", "120°"], answer: 2, why: "Angles are measured from the normal. The angle of incidence is 90° − 30° = 60°, and the angle of reflection equals it." }

    /* =================== 7 MAGNETISM AND ELECTROMAGNETISM =================== */
    {
      id: "magnetism", num: 7, name: "Magnetism and electromagnetism",
      cards: [
        { q: "State the rules for magnetic poles and name the magnetic materials.", a: "Like poles repel, unlike poles attract (non-contact forces). The magnetic materials are iron, steel, cobalt and nickel. An induced magnet always attracts and loses most of its magnetism when removed from the field.", ho: false },
        { q: "What is a magnetic field and how is it shown?", a: "The region where a magnet or magnetic material experiences a force. Field lines run from north to south; the field is strongest where the lines are closest (at the poles).", ho: false },
        { q: "Why does a compass point north?", a: "A compass needle is a small bar magnet that lines up with the Earth's magnetic field, which shows that the Earth has a magnetic core.", ho: false },
        { q: "Describe the magnetic field around a current-carrying wire.", a: "Concentric circles around the wire. The field is stronger with a larger current and closer to the wire. Reversing the current reverses the field direction.", ho: false },
        { q: "How can the magnetic field of a solenoid be made stronger?", a: "Increase the current, add more turns, or add an iron core. Outside it is like a bar magnet; inside it is strong and uniform.", ho: false },
        { q: "What is the motor effect?", a: "A conductor carrying a current in a magnetic field experiences a force, because the field of the wire interacts with the external field. The force is greatest at right angles to the field and zero if the wire is parallel to it.", ho: false },
        { q: "State the equation for the force on a conductor in a magnetic field.", a: "F = B I l, where F is force (N), B is magnetic flux density (T), I is current (A) and l is the length of conductor in the field (m).", ho: false },
        { q: "State Fleming's left-hand rule. (Higher tier)", a: "First finger = field (north to south), second finger = current (positive to negative), thumb = force (motion). The three are mutually at right angles.", ho: true },
        { q: "How does a d.c. electric motor keep rotating? (Higher tier)", a: "The coil carries current in a magnetic field, so forces act in opposite directions on its two sides and make it rotate. A split-ring commutator reverses the current every half turn, so the turning force stays in the same direction.", ho: true },
        { q: "What is the generator effect? (physics only)", a: "A potential difference is induced across a conductor when it moves relative to a magnetic field (cutting field lines), or when the field around it changes. If the circuit is complete a current flows.", ho: false },
        { q: "How can the size of the induced pd be increased? (physics only)", a: "Move the conductor or magnet faster, use a stronger magnet, or use more turns on the coil.", ho: false },
        { q: "Compare an alternator and a dynamo. (physics only)", a: "Both generate pd by rotating a coil in a magnetic field. An alternator uses slip rings and produces a.c. A dynamo uses a split-ring commutator and produces d.c.", ho: false },
        { q: "Explain how a microphone and a loudspeaker work. (physics only)", a: "Microphone: sound waves move a diaphragm and coil in a magnetic field, inducing a pd (generator effect). Loudspeaker: alternating current in a coil in a magnetic field gives a varying force (motor effect), moving a cone to produce sound.", ho: false },
        { q: "How does a transformer work, and what is the equation linking pds and turns? (physics only)", a: "A.c. in the primary coil creates a changing magnetic field in the iron core, inducing an alternating pd in the secondary coil. V_s / V_p = n_s / n_p. If 100% efficient, V_p I_p = V_s I_s.", ho: false }
      ],
      mcq: [
        { q: "Which group contains only magnetic materials?", options: ["Copper, aluminium and zinc", "Iron, copper and nickel", "Steel, aluminium and cobalt", "Iron, nickel and cobalt"], answer: 3, why: "The magnetic materials are iron, steel, cobalt and nickel. Copper and aluminium are not magnetic." },
        { q: "A wire of length 0.10 m carrying a current of 5.0 A lies at right angles to a magnetic field of flux density 0.20 T. What force acts on it?", options: ["0.1 N", "10 N", "1 N", "0.5 N"], answer: 0, why: "F = B I l = 0.20 × 5.0 × 0.10 = 0.10 N." },
        { q: "Which change would NOT alter the strength of the magnetic field of a solenoid?", options: ["Adding more turns", "Adding an iron core", "Reversing the direction of the current", "Increasing the current"], answer: 2, why: "Reversing the current reverses the direction of the field but not its strength. The others all change the strength." },
        { q: "Which change would decrease the pd induced in a generator?", options: ["Rotating the coil faster", "Using a weaker magnet", "Adding more turns to the coil", "Using a stronger magnet"], answer: 1, why: "A weaker magnet means a smaller rate of cutting of magnetic field, and so a smaller induced pd." },
        { q: "A transformer has 20 times as many turns on the primary coil as on the secondary coil. The primary pd is 230 V. What is the secondary pd?", options: ["230 V", "4 600 V", "20 V", "11.5 V"], answer: 3, why: "V_s = V_p × (n_s / n_p) = 230 × 1/20 = 11.5 V. It is a step-down transformer." },
        { q: "Why will a transformer not work with a battery (d.c.)?", options: ["A steady d.c. gives a constant magnetic field, so no pd is induced in the secondary coil", "D.c. cannot flow through copper", "D.c. has too low a voltage", "D.c. melts the iron core"], answer: 0, why: "A pd is only induced by a changing magnetic field, which needs alternating current in the primary coil." },
        { q: "In the motor effect, for a given current and field, the force on the wire is greatest when the wire is:", options: ["parallel to the field", "moving in the same direction as the field", "at right angles to the field", "outside the field"], answer: 2, why: "The force is proportional to the component of the field at right angles to the wire. Parallel to the field the force is zero." },
        { q: "Which statement is correct?", options: ["A loudspeaker uses the generator effect and a microphone uses the motor effect", "A loudspeaker uses the motor effect and a microphone uses the generator effect", "Both use the motor effect", "Both use the generator effect"], answer: 1, why: "A loudspeaker turns current into force (motor effect). A microphone turns movement into pd (generator effect)." },
        { q: "Why does the needle of a compass point north?", options: ["It is attracted to the Pole Star", "It is attracted by gravity", "It lines up with the Earth's magnetic field", "It is repelled by the Sun"], answer: 2, why: "The needle is a small magnet. It aligns with the Earth's magnetic field, which is produced by its core." },
        { q: "A 100% efficient transformer has an input of 230 V and 2.0 A. The output pd is 11.5 V. What is the output current?", options: ["40 A", "2.0 A", "460 A", "0.05 A"], answer: 0, why: "Input power = 230 × 2.0 = 460 W. I_s = 460 ÷ 11.5 = 40 A. Stepping the pd down steps the current up." }
      ]
    },

        { q: "How does a star form and why is a main sequence star stable?", a: "Gravity pulls clouds of dust and gas (a nebula) together to form a protostar. The temperature rises until hydrogen nuclei fuse into helium. In the main sequence the inward force of gravity is balanced by the outward force from the energy released in fusion.", ho: false },

        { q: "Where were the different chemical elements made?", a: "Fusion in stars makes elements up to iron. Elements heavier than iron are made in supernova explosions. The material is scattered through space and may form new stars and planets.", ho: false },

        { q: "How does orbital speed relate to orbital radius for a stable orbit? (Higher tier)", a: "A stable orbit at a given radius needs a particular speed. If the radius changes, the speed must change: a smaller radius needs a higher speed; a larger radius needs a lower speed.", ho: true },
        { q: "What is red-shift and what does it show? (physics only)", a: "The observed wavelength of light from distant galaxies is longer than expected. This shows the galaxies are moving away. More distant galaxies show greater red-shift, so they move away faster, which shows the Universe is expanding.", ho: false },
        { q: "Describe the Big Bang theory. (physics only)", a: "The Universe began from a very small region that was extremely hot and dense, and it has been expanding ever since.", ho: false },
        { q: "What is cosmic microwave background radiation (CMBR) and why is it important? (physics only)", a: "Microwave radiation arriving from all directions in space. It is a remnant of the early hot Universe and is evidence supporting the Big Bang.", ho: false },
        { q: "What are dark matter and dark energy? (physics only)", a: "Theoretical explanations for observations that cannot be explained by visible matter. Dark matter is invoked for the extra gravitational effect seen in galaxies. Dark energy is invoked to explain the accelerating expansion of the Universe. Neither has been directly observed.", ho: false }
      ],
      mcq: [
        { q: "Light from a distant galaxy is red-shifted. What does this show?", options: ["The galaxy is moving towards us", "The galaxy is moving away from us", "The galaxy is stationary", "The galaxy is very hot"], answer: 1, why: "Red-shift means the observed wavelength is longer than expected, which occurs when the source is moving away." },
        { q: "Which sequence shows the life cycle of a star of a similar mass to the Sun?", options: ["Protostar → main sequence → red supergiant → supernova → neutron star", "Nebula → red giant → main sequence → white dwarf", "Nebula → protostar → main sequence → supernova → black dwarf", "Nebula → protostar → main sequence → red giant → white dwarf → black dwarf"], answer: 3, why: "A Sun-sized star becomes a red giant, then a white dwarf, then cools to a black dwarf. Supernovae happen only to much more massive stars." },
        { q: "Why is a main sequence star stable?", options: ["Inward gravity is balanced by the outward force from the energy released in fusion", "Fusion has stopped", "The star has run out of hydrogen", "There is no gravity in the core"], answer: 0, why: "The star neither collapses nor expands because gravity (inwards) and the radiation/fusion pressure (outwards) balance." },
        { q: "Where were elements heavier than iron formed?", options: ["In the Big Bang", "In the cores of main sequence stars", "In supernova explosions", "On the surface of the Sun"], answer: 2, why: "Fusion in stars produces elements up to iron. The extreme conditions in a supernova produce heavier elements." },
        { q: "Which observation is evidence for the Big Bang theory?", options: ["The seasons on Earth", "Cosmic microwave background radiation", "The existence of black holes", "The orbit of the Moon"], answer: 1, why: "CMBR is the cooled remnant of the hot early Universe. It is, together with red-shift, key evidence for the Big Bang." },
        { q: "A satellite is in a stable circular orbit around the Earth. Which statement is correct?", options: ["Its speed is constant but its velocity is changing", "Both its speed and its velocity are constant", "Its velocity is constant but its speed is changing", "The resultant force on it is zero"], answer: 0, why: "Gravity provides a resultant force towards the centre, so the direction of motion (and so the velocity) keeps changing while the speed stays the same.", ho: true },
        { q: "What happens in the core of a main sequence star?", options: ["Helium nuclei fuse to form carbon", "Atoms split by fission", "Gravity is the only process", "Hydrogen nuclei fuse to form helium"], answer: 3, why: "The main sequence is the stable phase when hydrogen is fusing into helium, releasing the star's energy." },
        { q: "A satellite moves from its orbit to a higher orbit further from the Earth and stays in a stable orbit. What must happen to its orbital speed?", options: ["It must increase", "It must stay the same", "It must decrease", "It must become zero"], answer: 2, why: "Gravity is weaker at greater distance, so a lower speed is needed for a stable orbit at a larger radius.", ho: true }
      ]
    }

<script>
(function () {
"use strict";
const D = window.PHYSICS_DATA || { topics: [], equations: [], practicals: [] };
const app = document.getElementById("app");
const TOPICS = D.topics;
const topicById = Object.fromEntries(TOPICS.map(t => [t.id, t]));

/* ---------- helpers ---------- */
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const pick = a => a[Math.floor(Math.random() * a.length)];
const rand = (lo, hi) => lo + Math.random() * (hi - lo);
const sf = (x, n) => Number(Number(x).toPrecision(n));
const pct = (a, b) => b ? Math.round(100 * a / b) : 0;
const SUP = { "-": "⁻", "0": "⁰", "1": "¹", "2": "²", "3": "³", "4": "⁴", "5": "⁵", "6": "⁶", "7": "⁷", "8": "⁸", "9": "⁹" };
function fmt(x, n) {
  n = n || 3;
  if (x === 0) return "0";
  const ax = Math.abs(x);
  if (ax >= 1e6 || ax < 1e-3) {
    const [m, e] = Number(x).toExponential(n - 1).split("e");
    return String(Number(m)) + " × 10" + String(Number(e)).split("").map(c => SUP[c] || c).join("");
  }
  const v = sf(x, n);
  return ax >= 1000 ? v.toLocaleString("en-GB", { maximumFractionDigits: 6 }) : String(v);
}
function parseNum(s) {
  if (s == null) return NaN;
  let t = String(s).trim().replace(/\s+/g, "").replace(/,/g, "").replace(/−/g, "-");
  t = t.replace(/[×x*]10\^?\(?(-?\d+)\)?/i, "e$1");
  if (!/^[-+]?(\d+\.?\d*|\.\d+)(e[-+]?\d+)?$/i.test(t)) return NaN;
  return parseFloat(t);
}
const today = () => new Date().toISOString().slice(0, 10);

/* ---------- saved progress ---------- */
const KEY = "aqa-physics-8463-v1";
let S = { boxes: {}, quiz: {}, mistakes: [], calc: { r: 0, t: 0 }, streak: { last: null, days: 0 }, sel: [], conv: false };
try { const saved = JSON.parse(localStorage.getItem(KEY)); if (saved) S = Object.assign(S, saved); } catch (e) {}
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
function touchStreak() {
  const t = today();
  if (S.streak.last === t) return;
  const y = new Date(Date.now() - 864e5).toISOString().slice(0, 10);
  S.streak.days = S.streak.last === y ? S.streak.days + 1 : 1;
  S.streak.last = t;
  save(); drawStreak();
}
function drawStreak() {
  const y = new Date(Date.now() - 864e5).toISOString().slice(0, 10);
  const live = S.streak.last === today() || S.streak.last === y;
  document.getElementById("streak").textContent = "Day streak: " + (live ? S.streak.days : 0);
}

/* ---------- topic selection (shared across modes) ---------- */
function selTopics() { const s = S.sel.filter(id => topicById[id]); return s.length ? s : TOPICS.map(t => t.id); }
function chipsHTML() {
  const all = !S.sel.length;
  return `<div class="chips" role="group" aria-label="Topics">
    <button class="chip" data-chip="all" aria-pressed="${all}">All topics</button>
    ${TOPICS.map(t => `<button class="chip" data-chip="${t.id}" aria-pressed="${!all && S.sel.includes(t.id)}">${t.num}. ${esc(t.name)}</button>`).join("")}
  </div>`;
}
function bindChips(onChange) {
  app.querySelectorAll("[data-chip]").forEach(b => b.onclick = () => {
    const id = b.dataset.chip;
    if (id === "all") S.sel = [];
    else S.sel = S.sel.includes(id) ? S.sel.filter(x => x !== id) : S.sel.concat(id);
    if (S.sel.length === TOPICS.length) S.sel = [];
    save(); onChange();
  });
}

/* ---------- item access ---------- */
function allCards(ids) { const out = []; ids.forEach(id => (topicById[id].cards || []).forEach((c, i) => out.push(Object.assign({ key: id + ":c" + i, topic: id }, c)))); return out; }
function allMcq(ids) { const out = []; ids.forEach(id => (topicById[id].mcq || []).forEach((m, i) => out.push(Object.assign({ key: id + ":m" + i, topic: id }, m)))); return out; }
function mcqByKey(k) { const [id, m] = k.split(":m"); const t = topicById[id]; return t && t.mcq[+m] ? Object.assign({ key: k, topic: id }, t.mcq[+m]) : null; }

  const cards = t.cards || [];
  const known = cards.filter((c, i) => (S.boxes[t.id + ":c" + i] || 0) >= 3).length;
  const q = S.quiz[t.id] || { r: 0, t: 0 };
  return { known, total: cards.length, cardPct: pct(known, cards.length), qPct: q.t ? pct(q.r, q.t) : null, qT: q.t };
}

/* ---------- views ---------- */
const views = {};
let cleanupKeys = null;
function setKeys(fn) { if (cleanupKeys) document.removeEventListener("keydown", cleanupKeys); cleanupKeys = fn; if (fn) document.addEventListener("keydown", fn); }

views.home = function () {
  setKeys(null);
  const totalCards = TOPICS.reduce((n, t) => n + (t.cards || []).length, 0);
  const known = TOPICS.reduce((n, t) => n + mastery(t).known, 0);
  const qr = Object.values(S.quiz).reduce((a, q) => [a[0] + q.r, a[1] + q.t], [0, 0]);
  const scored = TOPICS.map(t => { const m = mastery(t); return { t, score: m.qPct == null ? m.cardPct / 2 : (m.cardPct + m.qPct) / 2 }; }).sort((a, b) => a.score - b.score);
  const weakest = scored[0] && scored[0].t;
  app.innerHTML = `
    <div class="row between">
      <div><div class="eyebrow">Your progress</div><h2>Overview</h2></div>
      ${weakest ? `<button class="primary" id="go-weak">Revise ${esc(weakest.name)}</button>` : ""}
    </div>
    <div class="stats">
      <div class="stat"><b>${known}<small class="muted" style="font-size:.9rem">/${totalCards}</small></b><span>flashcards known</span></div>
      <div class="stat"><b>${qr[1] ? pct(qr[0], qr[1]) + "%" : "–"}</b><span>quiz accuracy (${qr[1]} answered)</span></div>
      <div class="stat"><b>${S.calc.t ? pct(S.calc.r, S.calc.t) + "%" : "–"}</b><span>calculations right (${S.calc.t} tried)</span></div>
    </div>
    <p class="muted">A card counts as known once you've marked it “Knew it” a few times. Pick a topic to revise it, or use the tabs above to practise across the whole course.</p>
    <div class="grid2">

        <button class="topic-card" data-topic="${t.id}">
          <span class="t-head"><span class="num">P${t.num}</span><span class="name">${esc(t.name)}</span></span>
          <span class="meter"><span>Cards</span><span class="bar"><i style="width:${m.cardPct}%"></i></span><span class="v">${m.cardPct}%</span></span>
          <span class="meter"><span>Quiz</span><span class="bar q"><i style="width:${m.qPct || 0}%"></i></span><span class="v">${m.qPct == null ? "–" : m.qPct + "%"}</span></span>
        </button>`; }).join("")}
    </div>
    ${S.mistakes.length ? `<div class="row between"><p><b>${S.mistakes.length}</b> quiz question${S.mistakes.length === 1 ? "" : "s"} to go back over.</p><button id="go-mist">Review mistakes</button></div>` : ""}`;
  app.querySelectorAll("[data-topic]").forEach(b => b.onclick = () => { S.sel = [b.dataset.topic]; save(); location.hash = "cards"; });
  const gw = document.getElementById("go-weak"); if (gw) gw.onclick = () => { S.sel = [weakest.id]; save(); location.hash = "cards"; };
  const gm = document.getElementById("go-mist"); if (gm) gm.onclick = () => { location.hash = "quiz"; setTimeout(startMistakes, 0); };
};

/* ---- flashcards (Leitner boxes 0–5) ---- */
let FC = null;
function buildDeck() {
  const cards = allCards(selTopics());
  const byBox = {};
  cards.forEach(c => { const b = S.boxes[c.key] || 0; (byBox[b] = byBox[b] || []).push(c); });
  let deck = [];
  Object.keys(byBox).sort((a, b) => a - b).forEach(b => deck = deck.concat(shuffle(byBox[b])));
  FC = { deck: deck.slice(0, 20), i: 0, flipped: false, seen: 0, again: new Set() };
}
views.cards = function () {
  if (!FC) buildDeck();
  drawCard();
};
function drawCard() {
  const c = FC.deck[FC.i];
  if (!c) {
    setKeys(null);
    app.innerHTML = `${chipsHTML()}<div class="empty"><h2>Set done</h2><p>You went through ${FC.seen} card${FC.seen === 1 ? "" : "s"}. Cards you didn't know will come up first next time.</p></div>

  }

  const t = topicById[c.topic];
  app.innerHTML = `${chipsHTML()}
    <div class="row between"><span class="muted" style="font-size:.85rem">Card ${FC.i + 1} of ${FC.deck.length} · <span class="badge topic">P${t.num} ${esc(t.name)}</span> ${c.ho ? '<span class="badge">HIGHER</span>' : ""}</span>

    <div class="progress"><i style="width:${100 * FC.i / FC.deck.length}%"></i></div>

      <span class="side">${FC.flipped ? "Answer" : "Question · tap to see the answer"}</span>
      <span class="q">${esc(c.q)}</span>
      ${FC.flipped ? `<span class="a">${esc(c.a)}</span>` : ""}

    ${FC.flipped ? `<div class="rate">
      <button class="again" data-r="0">Didn't know<span class="kbd">1</span></button>

  bindChips(() => { buildDeck(); drawCard(); });

  app.querySelectorAll("[data-r]").forEach(b => b.onclick = () => rateCard(+b.dataset.r));
  setKeys(e => {
    if (e.target.tagName === "INPUT") return;
    if (e.key === " ") { e.preventDefault(); FC.flipped = !FC.flipped; drawCard(); }
    else if (FC.flipped && ["1", "2", "3"].includes(e.key)) rateCard(+e.key - 1);

}
function rateCard(r) {
  const c = FC.deck[FC.i];
  const box = S.boxes[c.key] || 0;
  S.boxes[c.key] = r === 0 ? 0 : r === 1 ? Math.max(1, box) : Math.min(5, box + 1);

/* ---- generic multiple-choice runner (topic quiz, mistakes, units) ---- */
let QZ = null;

}

      <div class="row"><button class="primary" id="q-next">${QZ.i + 1 < QZ.items.length ? "Next question" : "See results"}</button><span class="kbd">Enter</span></div>` : `<span class="kbd">Press A–D or 1–4</span>`}`;

  setKeys(e => {
    if (QZ.picked == null) {
      const n = "1234".indexOf(e.key) >= 0 ? "1234".indexOf(e.key) : "abcd".indexOf(e.key.toLowerCase());
      if (n >= 0 && n < it.order.length && e.key.length === 1) answerQ(it.order[n]);
    } else if (e.key === "Enter") { e.preventDefault(); nextQ(); }
  });
}
function answerQ(o) {
  const it = QZ.items[QZ.i];
  QZ.picked = o;
  const ok = o === it.answer;
  if (ok) QZ.score++; else QZ.wrong.push(it);
  if (QZ.opts.onAnswer) QZ.opts.onAnswer(it, ok);
  touchStreak(); save(); drawQ();
}
function nextQ() { QZ.picked = null; QZ.i++; drawQ(); }
function quizEnd() {
  setKeys(null);

    let val = k === G.out ? sf(v[k], 3) : v[k], unit = spec.u;
    if (S.conv && spec.alt && Math.random() < 0.5) { val = sf(val / spec.alt.f, 3); unit = spec.alt.u; }
    return { k, n: spec.n, val, unit, si: spec.u, conv: unit !== spec.u };
  });
  if (G.consts) Object.values(G.consts).forEach(c => givens.push({ k: "g", n: c.n, val: c.val, unit: c.u, si: c.u, constant: true }));
  CQ = { G, target, answer: v[target], givens, done: false, input: "", result: null };
}
views.calc = function () {
  setKeys(null);
  if (!CQ || !selTopics().includes(CQ.G.topic)) newCalc();
  drawCalc();
};
function drawCalc() {
  const head = `<div><div class="eyebrow">Unlimited practice with fresh numbers</div><h2>Calculations</h2></div>${chipsHTML()}
    <label class="check"><input type="checkbox" id="conv" ${S.conv ? "checked" : ""}> Mix in unit conversions (g, cm, kJ, mA, minutes…)</label>`;
  if (!CQ) { app.innerHTML = head + `<p class="empty">No calculations for these topics. Atomic structure and space physics are mostly non-numerical; try the flashcards for those.</p>`; bindCalcHead(); return; }
  const { G, target } = CQ;
  const tv = G.vars[target];
  const t = topicById[G.topic];
  const unitTxt = tv.u ? tv.u : "no unit";
  let fb = "";
  if (CQ.result) {
    const conv = CQ.givens.filter(x => x.conv);
    const steps = [
      `Equation: <span class="mono">${esc(G.eq)}</span>`,
      target !== G.out ? `Rearrange: <span class="mono">${esc(G.re[target])}</span>` : "",
      conv.length ? `Convert to SI units: ${conv.map(x => `${esc(fmt(x.val))} ${esc(x.unit)} = ${esc(fmt(x.val * G.vars[x.k].alt.f))} ${esc(x.si)}`).join("; ")}` : "",
      `Substitute: <span class="mono">${CQ.givens.map(x => `${esc(symOf(x.k))} = ${esc(fmt(x.conv ? x.val * G.vars[x.k].alt.f : x.val))}${x.si ? " " + esc(x.si) : ""}`).join(", ")}</span>`,
      `Answer: <span class="mono">${esc(symOf(target))} = ${esc(fmt(CQ.answer))}${tv.u ? " " + esc(tv.u) : ""}</span>`
    ].filter(Boolean);
    const cls = CQ.result === "right" ? "good" : "bad";
    const title = CQ.result === "right" ? "Correct" : CQ.result === "shown" ? "Worked answer" : CQ.result === "power" ? "Right digits, wrong size. Check your unit conversions." : "Not quite";
    fb = `<div class="feedback ${cls}"><b>${title}</b><ol class="steps">${steps.map(s => `<li>${s}</li>`).join("")}</ol></div>`;
  }
  app.innerHTML = head + `
    <div class="row between"><span><span class="badge topic">P${t.num} ${esc(t.name)}</span> ${G.ho ? '<span class="badge">HIGHER</span>' : ""}</span>
      <span class="mono muted" style="font-size:.85rem">${S.calc.r}/${S.calc.t} right</span></div>
    <h3>${esc(G.name)}</h3>
    <p>Calculate the <b>${esc(tv.n)}</b>${tv.u ? ` in <b>${esc(tv.u)}</b>` : ""}.</p>
    <ul class="givens">${CQ.givens.map(x => `<li><span>${esc(x.n)}${x.constant ? " (take as)" : ""}</span><span class="val">${esc(fmt(x.val))}${x.unit ? " " + esc(x.unit) : ""}</span></li>`).join("")}</ul>
    <div class="answer-row">
      <input id="ans" inputmode="decimal" autocomplete="off" placeholder="your answer" value="${esc(CQ.input)}" ${CQ.result ? "disabled" : ""} aria-label="Your answer in ${esc(unitTxt)}">
      <span class="unit">${esc(unitTxt)}</span>
      ${CQ.result ? `<button class="primary" id="c-next">Next question</button>` : `<button class="primary" id="c-check">Check</button><button class="ghost" id="c-show">Show answer</button>`}
    </div>
    ${CQ.result ? "" : `<div class="row"><button class="chip" data-ins="−">− minus</button><button class="chip" data-ins="×10^">× 10ⁿ</button><button class="chip" data-ins="clear">Clear</button></div>`}
    ${fb}
    <p class="muted" style="font-size:.82rem">Answers within 2% count, so rounding to 2 or 3 significant figures is fine. Type powers of ten as 3.2e5 or 3.2x10^5.</p>`;
  bindCalcHead();
  const ans = document.getElementById("ans");
  const chk = document.getElementById("c-check");
  if (chk) {
    chk.onclick = checkCalc;
    document.getElementById("c-show").onclick = () => { CQ.result = "shown"; S.calc.t++; save(); drawCalc(); };
    ans.onkeydown = e => { if (e.key === "Enter") checkCalc(); };
    ans.oninput = () => { CQ.input = ans.value; };
    app.querySelectorAll("[data-ins]").forEach(b => b.onclick = () => {
      const s = b.dataset.ins;
      ans.value = s === "clear" ? "" : s === "−" ? (ans.value.startsWith("-") ? ans.value.slice(1) : "-" + ans.value) : ans.value + "x10^";
      CQ.input = ans.value; ans.focus();
    });
    if (window.matchMedia("(hover: hover)").matches) ans.focus();
  }
  const nx = document.getElementById("c-next");
  if (nx) { nx.onclick = () => { newCalc(); drawCalc(); }; nx.focus(); setKeys(e => { if (e.key === "Enter" && e.target.id !== "ans") { e.preventDefault(); newCalc(); drawCalc(); } }); }
}
function bindCalcHead() {
  bindChips(() => { newCalc(); drawCalc(); });
  document.getElementById("conv").onchange = e => { S.conv = e.target.checked; save(); newCalc(); drawCalc(); };
}
function checkCalc() {
  const ans = document.getElementById("ans");
  const x = parseNum(ans.value);
  if (isNaN(x)) { ans.setCustomValidity("Type a number"); ans.reportValidity(); return; }
  CQ.input = ans.value;
  const a = CQ.answer;
  const close = (p, q) => Math.abs(p - q) <= 0.02 * Math.abs(q);
  let res = close(x, a) ? "right" : "wrong";
  if (res === "wrong" && [1e3, 1e-3, 1e2, 1e-2, 1e6, 1e-6, 60, 1 / 60, 100, 0.01].some(k => close(x, a * k))) res = "power";
  CQ.result = res;
  S.calc.t++; if (res === "right") S.calc.r++;
  touchStreak(); save(); drawCalc();
}

    ${groups.length ? groups.map(gr => `<div><h3 style="margin-bottom:4px">P${gr.t.num} ${esc(gr.t.name)}</h3>

        <div class="sym"><div>${esc(e.words || "")}</div>${(e.symbols || []).map(s => `<div><span class="mono">${esc(s[0])}</span> ${esc(s[1])}${s[2] ? `, <span class="mono">${esc(s[2])}</span>` : ""}</div>`).join("")}</div>
      </div>`).join("")}</div>`).join("") : `<p class="empty">No equations for these topics.</p>`}`;
  bindChips(views.equations);
  document.getElementById("eqhide").onchange = e => { eqHide = e.target.checked; views.equations(); };
  document.getElementById("eq-units").onclick = () => { location.hash = "quiz"; setTimeout(startUnits, 0); };
  app.querySelectorAll(".e").forEach(el => { const tg = () => el.classList.toggle("hidden"); el.onclick = tg; el.onkeydown = ev => { if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); tg(); } }; });
};

  let h = location.hash.replace("#", "") || "home";
  if (!views[h]) h = "home";
  document.querySelectorAll("#tabs a").forEach(a => a.setAttribute("aria-current", a.getAttribute("href") === "#" + h ? "page" : "false"));
  if (h !== "cards") FC = null;
  views[h]();
}
window.addEventListener("hashchange", route);

drawStreak();
