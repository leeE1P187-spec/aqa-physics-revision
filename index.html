<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">

<meta name="mobile-web-app-capable" content="yes">

<style>
:root { color-scheme: light; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); -webkit-text-size-adjust: 100%; }
body { margin: 0; }
[hidden] { display: none !important; }

<title>Triple Science Revision</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: graph-paper ground, one centred working column, tab bar of study modes, topic chips as the shared filter */
:root {
  --bg: #eef1f6;
  --grid: rgba(38, 67, 233, 0.07);
  --surface: #ffffff;
  --surface-2: #f5f7fb;
  --ink: #14213d;
  --muted: #5b6478;
  --line: #d6dce8;
  --phys: #2643e9; --phys-soft: #e3e8ff;
  --bio: #17804d; --bio-soft: #dcf1e5;
  --chem: #7a3fd1; --chem-soft: #ece3fb;
  --accent: var(--phys);
  --accent-ink: #ffffff;
  --accent-soft: var(--phys-soft);
  --amber: #b9770e;
  --amber-soft: #fff3d6;
  --good: #1d8a4e;
  --good-soft: #dff3e7;
  --bad: #c43c3c;
  --bad-soft: #fbe3e3;
  /* system faces only, so the app needs no network once installed */
  --font-display: ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-body: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1322; --grid: rgba(123, 140, 255, 0.07); --surface: #151d31; --surface-2: #1b2540;
    --ink: #e6eaf3; --muted: #9ba5ba; --line: #283352; --phys: #7d8eff; --bio: #4fc98a; --chem: #b48cff; --accent-ink: #0d1322;
    --phys-soft: #232e58; --bio-soft: #163a2a; --chem-soft: #2e2352; --amber: #f2b648; --amber-soft: #3a2f16; --good: #4cc483; --good-soft: #163626;
    --bad: #f07575; --bad-soft: #3d1c22; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1322; --grid: rgba(123, 140, 255, 0.07); --surface: #151d31; --surface-2: #1b2540;
  --ink: #e6eaf3; --muted: #9ba5ba; --line: #283352; --phys: #7d8eff; --bio: #4fc98a; --chem: #b48cff; --accent-ink: #0d1322;
  --phys-soft: #232e58; --bio-soft: #163a2a; --chem-soft: #2e2352; --amber: #f2b648; --amber-soft: #3a2f16; --good: #4cc483; --good-soft: #163626;
  --bad: #f07575; --bad-soft: #3d1c22; color-scheme: dark;
}
/* subject colour: the accent follows the chosen subject in both themes */
:root[data-subject="biology"] { --accent: var(--bio); --accent-soft: var(--bio-soft); }
:root[data-subject="chemistry"] { --accent: var(--chem); --accent-soft: var(--chem-soft); }
* { box-sizing: border-box; }
body {
  background-color: var(--bg);
  background-image:
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 24px 24px;
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.55;
  min-height: 100vh;
}
.wrap {
  max-width: 860px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 56px;
  display: flex; flex-direction: column; gap: 18px;
}
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; line-height: 1.2; }
h1 { font-size: 1.7rem; letter-spacing: -0.01em; }
h2 { font-size: 1.25rem; }
h3 { font-size: 1.02rem; }
p { margin: 0; }
.muted { color: var(--muted); }
.mono { font-family: var(--font-mono); }
.eyebrow { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 600; }
header.top { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.spec { font-family: var(--font-mono); font-size: 0.78rem; color: var(--muted); }
.streak { font-family: var(--font-mono); font-size: 0.82rem; padding: 4px 10px; border-radius: 999px; background: var(--amber-soft); color: var(--amber); font-weight: 600; }

.subjects { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.subjects button { padding: 11px 6px; font-family: var(--font-display); font-size: 0.98rem; }
.subjects button[data-subj="biology"] { --c: var(--bio); --cs: var(--bio-soft); }
.subjects button[data-subj="chemistry"] { --c: var(--chem); --cs: var(--chem-soft); }
.subjects button[data-subj="physics"] { --c: var(--phys); --cs: var(--phys-soft); }
.subjects button { color: var(--c); }
.subjects button[aria-pressed="true"] { background: var(--c); border-color: var(--c); color: var(--accent-ink); }
.subjects button:disabled { color: var(--muted); }
nav.tabs { display: flex; gap: 4px; overflow-x: auto; padding: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); scrollbar-width: none; }
nav.tabs a { flex: 0 0 auto; text-decoration: none; color: var(--muted); font-weight: 600; font-size: 0.88rem; padding: 8px 12px; border-radius: 7px; }
nav.tabs a:hover { color: var(--ink); background: var(--surface-2); }
nav.tabs a[aria-current="page"] { background: var(--accent); color: var(--accent-ink); }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.between { justify-content: space-between; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }

button, .btn { font: inherit; cursor: pointer; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); padding: 9px 14px; font-weight: 600; font-size: 0.9rem; }
button:hover { border-color: var(--accent); }
button:focus-visible, a:focus-visible, input:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
button.ghost { background: transparent; }
button:disabled { opacity: 0.5; cursor: default; }
.chip { padding: 6px 11px; font-size: 0.82rem; border-radius: 999px; font-weight: 600; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
@media (max-width: 700px) {
  .chips { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; margin-inline: -18px; padding-inline: 18px; padding-block: 2px; -webkit-overflow-scrolling: touch; }
  .chips::-webkit-scrollbar { display: none; }
  .chips .chip { flex: 0 0 auto; }
}
.chip[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.badge { display: inline-block; font-size: 0.68rem; font-weight: 700; letter-spacing: 0.05em; padding: 2px 7px; border-radius: 5px; background: var(--amber-soft); color: var(--amber); vertical-align: middle; }
.badge.topic { background: var(--accent-soft); color: var(--accent); }

.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.stat { background: var(--surface-2); border-radius: 8px; padding: 10px 12px; }
.stat b { display: block; font-family: var(--font-display); font-size: 1.5rem; font-variant-numeric: tabular-nums; }
.stat span { font-size: 0.78rem; color: var(--muted); }

.topic-card { text-align: left; display: flex; flex-direction: column; gap: 8px; padding: 14px; font-weight: 400; }
.topic-card .t-head { display: flex; gap: 8px; align-items: baseline; }
.topic-card .num { font-family: var(--font-mono); color: var(--muted); font-size: 0.8rem; }
.topic-card .name { font-family: var(--font-display); font-weight: 600; font-size: 1rem; }
.meter { display: grid; grid-template-columns: 52px 1fr 40px; gap: 8px; align-items: center; font-size: 0.75rem; color: var(--muted); }
.bar { height: 6px; background: var(--surface-2); border-radius: 3px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); border-radius: 3px; }
.bar.q i { background: var(--amber); }
.meter .v { text-align: right; font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

.flash { min-height: 230px; display: flex; flex-direction: column; justify-content: center; gap: 12px; padding: 26px; cursor: pointer; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); text-align: left; font-weight: 400; font-size: 1.05rem; width: 100%; }
.flash .side { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 600; }
.flash .q { font-family: var(--font-display); font-size: 1.25rem; font-weight: 600; }
.flash .a { border-top: 1px dashed var(--line); padding-top: 12px; color: var(--ink); }
.rate { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.rate button { padding: 12px 6px; }
.rate .again { border-color: var(--bad); color: var(--bad); }
.rate .ok { border-color: var(--amber); color: var(--amber); }
.rate .got { border-color: var(--good); color: var(--good); }
.kbd { font-family: var(--font-mono); font-size: 0.7rem; color: var(--muted); font-weight: 400; display: block; }

.options { display: flex; flex-direction: column; gap: 8px; }
.opt { text-align: left; font-weight: 500; display: flex; gap: 10px; padding: 12px 14px; }
.opt .k { font-family: var(--font-mono); color: var(--muted); }
.opt:disabled { opacity: 1; cursor: default; }
@media (hover: none) { .kbd { display: none !important; } }
.opt.right { background: var(--good-soft); border-color: var(--good); }
.opt.wrong { background: var(--bad-soft); border-color: var(--bad); }
.feedback { border-radius: 8px; padding: 12px 14px; }
.feedback.good { background: var(--good-soft); }
.feedback.bad { background: var(--bad-soft); }
.feedback b { display: block; margin-bottom: 4px; }
.progress { height: 4px; background: var(--surface-2); border-radius: 2px; overflow: hidden; }
.progress i { display: block; height: 100%; background: var(--accent); transition: width .2s; }

.givens { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.givens li { display: flex; justify-content: space-between; gap: 12px; padding: 8px 12px; background: var(--surface-2); border-radius: 7px; }
.givens .val { font-family: var(--font-mono); font-weight: 600; white-space: nowrap; }
.eqline { font-family: var(--font-mono); font-size: 1.05rem; font-weight: 600; color: var(--accent); }
.answer-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.answer-row input { font: inherit; font-family: var(--font-mono); font-size: 17px; padding: 9px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); width: 180px; max-width: 100%; }
.unit { font-family: var(--font-mono); color: var(--muted); }
.steps { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 4px; }
.steps .mono { font-weight: 600; }
label.check { display: inline-flex; gap: 8px; align-items: center; font-size: 0.88rem; cursor: pointer; }

.eq-item { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr); gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); }
.eq-item:first-of-type { border-top: 0; }
.eq-item .e { font-family: var(--font-mono); font-weight: 600; font-size: 1rem; color: var(--accent); cursor: pointer; }
.eq-item .e.hidden { filter: blur(7px); user-select: none; }
.sym { font-size: 0.82rem; color: var(--muted); }
.sym .mono { color: var(--ink); }

details.prac { border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
details.prac summary { cursor: pointer; padding: 14px 16px; display: flex; gap: 10px; align-items: center; justify-content: space-between; font-family: var(--font-display); font-weight: 600; list-style: none; }
details.prac summary::-webkit-details-marker { display: none; }
details.prac summary::after { content: "+"; font-family: var(--font-mono); color: var(--muted); }
details.prac[open] summary::after { content: "−"; }
details.prac .body { padding: 0 16px 16px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
details.prac ol, details.prac ul { margin: 0; padding-left: 20px; }
.vars { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: 0.9rem; }
.vars dt { font-weight: 700; font-family: var(--font-mono); color: var(--accent); }
.vars dd { margin: 0; }
.empty { text-align: center; padding: 30px 10px; color: var(--muted); }
.mistake-list { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 8px; font-size: 0.9rem; }

@media (max-width: 560px) {
  .stats { grid-template-columns: 1fr 1fr 1fr; }
  .stat b { font-size: 1.2rem; }
  .eq-item { grid-template-columns: 1fr; gap: 4px; }
  .flash { padding: 20px; }
  h1 { font-size: 1.4rem; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <div class="spec" id="spec">AQA GCSE · Higher tier</div>
      <h1>Triple Science Revision</h1>
    </div>
    <span class="streak" id="streak">Day streak: 0</span>
  </header>
  <div class="subjects" id="subjects" role="group" aria-label="Subject">
    <button data-subj="biology">Biology</button>
    <button data-subj="chemistry">Chemistry</button>
    <button data-subj="physics">Physics</button>
  </div>
  <nav class="tabs" id="tabs">
    <a href="#home">Overview</a>
    <a href="#cards">Flashcards</a>
    <a href="#quiz">Quiz</a>
    <a href="#calc">Calculations</a>
    <a href="#equations" id="tab-eq">Equations</a>
    <a href="#practicals">Required practicals</a>
  </nav>
  <main id="app" class="panel"><p class="muted">Loading questions…</p></main>
  <p class="muted" style="font-size:0.78rem" id="foot">Progress is saved on this device only.</p>
</div>

<script>
/* AQA GCSE Biology (8461) revision content. Higher tier flags (ho) follow the "(HT only)" markings in the AQA 8461 specification v1.0. */
(function () {
  function c(q, a, ho) { return { q: q, a: a, ho: !!ho }; }
  // m(question, correct answer, [3 wrong answers], index to place the correct answer at, explanation, ho)
  function m(q, correct, wrong, idx, why, ho) {
    var o = wrong.slice();
    o.splice(idx, 0, correct);
    return { q: q, options: o, answer: idx, why: why, ho: !!ho };
  }

  window.BIOLOGY_DATA = {
    topics: [
      /* ===================== 1 CELL BIOLOGY ===================== */
      {
        id: "b-cell", num: 1, name: "Cell biology",
        cards: [
          c("What are the main differences between eukaryotic and prokaryotic cells?",
            "Eukaryotic cells (plant and animal) have their genetic material enclosed in a nucleus. Prokaryotic cells (bacteria) are much smaller and their DNA is a single loop, not enclosed in a nucleus, sometimes with extra small rings called plasmids."),
          c("Name the parts of a bacterial cell.",
            "Cytoplasm, cell membrane, cell wall, a single loop of DNA (not in a nucleus) and one or more plasmids."),
          c("State the function of each part of an animal cell: nucleus, cytoplasm, cell membrane, mitochondria, ribosomes.",
            "Nucleus: contains genetic material and controls the cell. Cytoplasm: where most chemical reactions happen. Cell membrane: controls what enters and leaves. Mitochondria: site of aerobic respiration. Ribosomes: site of protein synthesis."),
          c("Which extra structures do plant cells often have, and what do they do?",
            "Chloroplasts (absorb light for photosynthesis), a permanent vacuole filled with cell sap (keeps the cell rigid), and a cellulose cell wall (strengthens the cell)."),
          c("How are sperm, nerve and muscle cells adapted to their functions?",
            "Sperm: tail to swim and many mitochondria for energy. Nerve cell: long and branched to carry impulses to other cells. Muscle cell: contains protein fibres that contract (shorten) and many mitochondria for energy."),
          c("How are root hair, xylem and phloem cells adapted to their functions?",
            "Root hair cell: large surface area for absorbing water and mineral ions. Xylem: hollow tubes strengthened by lignin to carry water. Phloem: tubes of elongated cells with pores in the end walls to carry dissolved sugars."),
          c("What is cell differentiation and why is it important?",
            "It is the process by which a cell changes to become specialised for a particular job, by acquiring different sub-cellular structures. It allows a multicellular organism to develop different tissues and organs. Most animal cells differentiate early, but many plant cells can differentiate throughout life."),
          c("How does an electron microscope differ from a light microscope?",
            "An electron microscope has much higher magnification and resolving power. It lets biologists see sub-cellular structures (such as ribosomes and the internal structure of mitochondria) in much finer detail."),
          c("State the magnification formula and use it: an image is 60 mm long and the magnification is ×400. What is the real size?",
            "magnification = size of image ÷ size of real object. Real size = 60 ÷ 400 = 0.15 mm, which is 150 µm."),
          c("Give the unit conversions between mm, µm and nm.",
            "1 mm = 1000 µm, and 1 µm = 1000 nm. Always convert the image and the object to the same unit before calculating magnification."),
          c("A bacterium divides by binary fission every 20 minutes. Starting from one cell, how many bacteria are there after 10 hours? Give the answer in standard form.",
            "10 hours = 30 divisions, so the number is 2³⁰ = 1 073 741 824 ≈ 1.07 × 10⁹ bacteria.", true),
          c("Describe how to prepare an uncontaminated culture of bacteria using aseptic technique.",
            "Sterilise the Petri dish and agar, and sterilise the inoculating loop by passing it through a flame. Transfer the bacteria, tape the lid on (not fully sealed) and store the dish upside down. In school, incubate at about 25 °C to avoid growing harmful pathogens."),
          c("Describe the three overall stages of the cell cycle.",
            "1) The cell grows, increases its sub-cellular structures and the DNA replicates to form two copies of each chromosome. 2) Mitosis: one set of chromosomes is pulled to each end of the cell and the nucleus divides. 3) The cytoplasm and cell membrane divide, forming two identical cells."),
          c("What is a stem cell, and where are stem cells found?",
            "A stem cell is an undifferentiated cell that can divide to make more cells of the same type and can differentiate into other types. They are found in embryos, in adult bone marrow, and in plant meristems."),
          c("What are the risks and benefits of using stem cells in medicine?",
            "Benefits: can replace damaged tissue, for example in diabetes or paralysis. In therapeutic cloning the embryo has the patient's genes, so the cells are not rejected. Risks: possible transfer of viral infection, and some people have ethical or religious objections."),
          c("Define diffusion and list the factors that affect its rate.",
            "Diffusion is the net movement of particles from an area of higher concentration to an area of lower concentration. The rate depends on the concentration gradient, the temperature and the surface area of the membrane."),
          c("Why do large multicellular organisms need exchange surfaces and a transport system?",
            "They have a small surface area to volume ratio, so diffusion alone is too slow to supply all their cells. Exchange surfaces have a large surface area, are thin (short diffusion path), and (in animals) have a good blood supply and are ventilated."),
          c("Define osmosis, and explain how it differs from active transport.",
            "Osmosis is the diffusion of water from a dilute solution to a more concentrated solution through a partially permeable membrane. Active transport moves substances from a more dilute to a more concentrated region (against a concentration gradient) and needs energy from respiration.")
        ],
        mcq: [
          m("A student measures a drawing of a cell as 45 mm long. The magnification is ×300. What is the real length of the cell?",
            "150 µm", ["15 µm", "13 500 µm", "0.15 µm"], 0,
            "Real size = image ÷ magnification = 45 ÷ 300 = 0.15 mm. Multiply by 1000 to convert to micrometres: 150 µm."),
          m("A cell is 40 µm long. In a photomicrograph it measures 8 mm. What is the magnification?",
            "×200", ["×320", "×5", "×0.005"], 1,
            "Convert to the same unit: 8 mm = 8000 µm. Magnification = 8000 ÷ 40 = ×200."),
          m("Which structure is found in plant cells but NOT in animal cells?",
            "Permanent vacuole", ["Mitochondria", "Ribosomes", "Cell membrane"], 2,
            "Plant cells have a permanent vacuole (along with chloroplasts and a cellulose cell wall). Mitochondria, ribosomes and a membrane are in both."),
          m("Sperm cells contain many mitochondria. Why?",
            "To release energy by aerobic respiration for swimming", ["To make proteins for the tail", "To store genetic information", "To digest the egg membrane"], 3,
            "Mitochondria are the site of aerobic respiration, which supplies energy for the tail to move."),
          m("A potato cylinder has a mass of 2.40 g. After 24 hours in a sugar solution its mass is 2.04 g. What is the percentage change in mass?",
            "−15%", ["+15%", "−0.36%", "−17.6%"], 1,
            "Change = 2.04 − 2.40 = −0.36 g. Percentage change = −0.36 ÷ 2.40 × 100 = −15%. Always divide by the original mass."),
          m("Which statement describes a difference between active transport and diffusion?",
            "Active transport needs energy from respiration; diffusion does not", ["Active transport moves particles down a concentration gradient", "Diffusion only happens in plant cells", "Diffusion needs a carrier protein and energy"], 2,
            "Active transport moves substances against a concentration gradient using energy from respiration. Diffusion is passive."),
          m("A plant cell is placed in pure water. What happens?",
            "Water enters by osmosis and the cell becomes turgid", ["Water leaves by osmosis and the cell becomes flaccid", "Dissolved ions leave and the cell shrinks", "Nothing happens because the membrane is impermeable to water"], 3,
            "Pure water is more dilute than the cell contents, so water moves into the cell by osmosis. The cell wall stops it bursting and the cell becomes firm (turgid)."),
          m("What is produced when a body cell divides by mitosis?",
            "Two genetically identical daughter cells", ["Four genetically different cells", "Two cells each with half the chromosomes", "One cell with double the chromosomes"], 0,
            "Mitosis copies the DNA and divides once to give two identical cells. Four different cells with half the chromosomes is meiosis."),
          m("A clear zone around an antibiotic disc has a radius of 1.5 cm. What is the area of the zone? (Use π = 3.14)",
            "7.1 cm²", ["4.7 cm²", "9.4 cm²", "28.3 cm²"], 1,
            "Area = πr² = 3.14 × 1.5 × 1.5 = 7.07 ≈ 7.1 cm². The other values come from forgetting to square r or using the diameter."),
          m("A cube has sides of 2 cm. What is its surface area to volume ratio?",
            "3 : 1", ["6 : 1", "24 : 1", "1 : 3"], 2,
            "Surface area = 6 × 2 × 2 = 24 cm². Volume = 2 × 2 × 2 = 8 cm³. Ratio = 24 : 8 = 3 : 1. Smaller objects have a larger ratio."),
          m("Why has the electron microscope increased our understanding of cells?",
            "It has higher magnification and resolving power, so sub-cellular structures can be seen in detail", ["It can show living cells moving", "It uses coloured stains to show organelles", "It is cheaper and easier to use than a light microscope"], 3,
            "Electron microscopes have much greater magnification and resolution than light microscopes, revealing structures such as ribosomes and plasmids."),

        { q: "A spring has a spring constant of 25 N/m and is stretched by 0.20 m (within its limit). What force is applied?", options: ["125 N", "0.008 N", "5 N", "50 N"], answer: 2, why: "F = k e = 25 × 0.20 = 5 N." },
        { q: "A car accelerates uniformly from rest to 10 m/s in 5 s. What distance does it travel in this time?", options: ["10 m", "25 m", "50 m", "12.5 m"], answer: 1, why: "The area under the velocity–time graph is a triangle: ½ × 5 × 10 = 25 m. 50 m would assume a constant 10 m/s." },

        { q: "A 2 kg trolley moving at 3 m/s collides with a stationary 1 kg trolley and they stick together. What is their speed after the collision?", options: ["2 m/s", "1 m/s", "3 m/s", "4.5 m/s"], answer: 0, why: "Momentum before = 2 × 3 = 6 kg m/s. After: 6 = 3 × v, so v = 2 m/s." },
        { q: "A force of 600 N acts on an area of 0.020 m². What is the pressure?", options: ["12 Pa", "30 000 Pa", "300 Pa", "12 000 Pa"], answer: 1, why: "p = F ÷ A = 600 ÷ 0.020 = 30 000 Pa." },
        { q: "A car brakes with a constant braking force. If its speed doubles, its braking distance:", options: ["doubles", "triples", "quadruples", "stays the same"], answer: 2, why: "The work done by the brakes equals the kinetic energy, and kinetic energy depends on v². Double the speed means four times the energy, so about four times the distance." },

let S = { boxes: {}, quiz: {}, mistakes: [], calc: { r: 0, t: 0 }, streak: { last: null, days: 0 }, selBy: {}, subject: "physics", conv: false };
try {
  const saved = JSON.parse(localStorage.getItem(KEY));
  if (saved) {
    if (Array.isArray(saved.sel)) { saved.selBy = Object.assign({ physics: saved.sel }, saved.selBy || {}); delete saved.sel; }
    S = Object.assign(S, saved);
  }
} catch (e) {}
Object.defineProperty(S, "sel", { get() { return S.selBy[S.subject] || []; }, set(v) { S.selBy[S.subject] = v; }, enumerable: false });
function subjMistakes() { return S.mistakes.filter(k => topicById[k.split(":m")[0]]); }
function setSubject(k) {
  if (!SUBJECTS[k] || !SUBJECTS[k].data) k = Object.keys(SUBJECTS).reverse().find(x => SUBJECTS[x].data) || "physics";
  S.subject = k; SUBJ = SUBJECTS[k]; SL = SUBJ.letter;
  D = SUBJ.data || { topics: [], equations: [], practicals: [] };
  TOPICS = D.topics; topicById = Object.fromEntries(TOPICS.map(t => [t.id, t]));
  document.documentElement.setAttribute("data-subject", k);
  document.getElementById("spec").textContent = "AQA GCSE " + SUBJ.name + " " + SUBJ.code + " · Higher tier";
  document.getElementById("tab-eq").textContent = k === "physics" ? "Equations" : "Formulae";
  document.getElementById("foot").textContent = "Progress is saved on this device only." + (k === "physics" ? " Equations use g = 9.8 N/kg, as on the AQA equation sheet." : "");
  document.querySelectorAll("#subjects [data-subj]").forEach(b => { b.setAttribute("aria-pressed", String(b.dataset.subj === k)); b.disabled = !SUBJECTS[b.dataset.subj].data; });
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
function touchStreak() {
  const t = today();
  if (S.streak.last === t) return;
  const y = new Date(Date.now() - 864e5).toISOString().slice(0, 10);
  S.streak.days = S.streak.last === y ? S.streak.days + 1 : 1;
  S.streak.last = t;
  save(); drawStreak();
}
function drawStreak() {
  const y = new Date(Date.now() - 864e5).toISOString().slice(0, 10);
  const live = S.streak.last === today() || S.streak.last === y;
  document.getElementById("streak").textContent = "Day streak: " + (live ? S.streak.days : 0);
}

/* ---------- topic selection (shared across modes) ---------- */
function selTopics() { const s = S.sel.filter(id => topicById[id]); return s.length ? s : TOPICS.map(t => t.id); }
function chipsHTML() {
  const all = !S.sel.length;
  return `<div class="chips" role="group" aria-label="Topics">
    <button class="chip" data-chip="all" aria-pressed="${all}">All topics</button>
    ${TOPICS.map(t => `<button class="chip" data-chip="${t.id}" aria-pressed="${!all && S.sel.includes(t.id)}">${t.num}. ${esc(t.name)}</button>`).join("")}
  </div>`;
}
function bindChips(onChange) {
  app.querySelectorAll("[data-chip]").forEach(b => b.onclick = () => {
    const id = b.dataset.chip;
    if (id === "all") S.sel = [];
    else S.sel = S.sel.includes(id) ? S.sel.filter(x => x !== id) : S.sel.concat(id);
    if (S.sel.length === TOPICS.length) S.sel = [];
    save(); onChange();
  });
}

/* ---------- item access ---------- */
function allCards(ids) { const out = []; ids.forEach(id => (topicById[id].cards || []).forEach((c, i) => out.push(Object.assign({ key: id + ":c" + i, topic: id }, c)))); return out; }
function allMcq(ids) { const out = []; ids.forEach(id => (topicById[id].mcq || []).forEach((m, i) => out.push(Object.assign({ key: id + ":m" + i, topic: id }, m)))); return out; }
function mcqByKey(k) { const [id, m] = k.split(":m"); const t = topicById[id]; return t && t.mcq[+m] ? Object.assign({ key: k, topic: id }, t.mcq[+m]) : null; }
function mastery(t) {
  const cards = t.cards || [];
  const known = cards.filter((c, i) => (S.boxes[t.id + ":c" + i] || 0) >= 3).length;
  const q = S.quiz[t.id] || { r: 0, t: 0 };
  return { known, total: cards.length, cardPct: pct(known, cards.length), qPct: q.t ? pct(q.r, q.t) : null, qT: q.t };
}

/* ---- flashcards (Leitner boxes 0–5) ---- */
let FC = null;
function buildDeck() {
  const cards = allCards(selTopics());
  const byBox = {};
  cards.forEach(c => { const b = S.boxes[c.key] || 0; (byBox[b] = byBox[b] || []).push(c); });
  let deck = [];
  Object.keys(byBox).sort((a, b) => a - b).forEach(b => deck = deck.concat(shuffle(byBox[b])));
  FC = { deck: deck.slice(0, 20), i: 0, flipped: false, seen: 0, again: new Set() };
}
views.cards = function () {
  if (!FC) buildDeck();
  drawCard();
};
function drawCard() {
  const c = FC.deck[FC.i];
  if (!c) {
    setKeys(null);
    app.innerHTML = `${chipsHTML()}<div class="empty"><h2>Set done</h2><p>You went through ${FC.seen} card${FC.seen === 1 ? "" : "s"}. Cards you didn't know will come up first next time.</p></div>
      <div class="row"><button class="primary" id="fc-new">Next set</button></div>`;
    bindChips(() => { buildDeck(); drawCard(); });
    document.getElementById("fc-new").onclick = () => { buildDeck(); drawCard(); };
    return;
  }
  const box = S.boxes[c.key] || 0;
  const t = topicById[c.topic];
  app.innerHTML = `${chipsHTML()}
    <div class="row between"><span class="muted" style="font-size:.85rem">Card ${FC.i + 1} of ${FC.deck.length} · <span class="badge topic">${SL}${t.num} ${esc(t.name)}</span> ${c.ho ? '<span class="badge">HIGHER</span>' : ""}</span>
      <span class="muted mono" style="font-size:.78rem">box ${box}/5</span></div>
    <div class="progress"><i style="width:${100 * FC.i / FC.deck.length}%"></i></div>
    <button class="flash" id="flash" aria-live="polite">
      <span class="side">${FC.flipped ? "Answer" : "Question · tap to see the answer"}</span>
      <span class="q">${esc(c.q)}</span>
      ${FC.flipped ? `<span class="a">${esc(c.a)}</span>` : ""}
    </button>
    ${FC.flipped ? `<div class="rate">
      <button class="again" data-r="0">Didn't know<span class="kbd">1</span></button>
      <button class="ok" data-r="1">Sort of<span class="kbd">2</span></button>
      <button class="got" data-r="2">Knew it<span class="kbd">3</span></button></div>` : ""}`;
  bindChips(() => { buildDeck(); drawCard(); });
  document.getElementById("flash").onclick = () => { FC.flipped = !FC.flipped; drawCard(); };
  app.querySelectorAll("[data-r]").forEach(b => b.onclick = () => rateCard(+b.dataset.r));
  setKeys(e => {
    if (e.target.tagName === "INPUT") return;
    if (e.key === " ") { e.preventDefault(); FC.flipped = !FC.flipped; drawCard(); }
    else if (FC.flipped && ["1", "2", "3"].includes(e.key)) rateCard(+e.key - 1);
  });
}
function rateCard(r) {
  const c = FC.deck[FC.i];
  const box = S.boxes[c.key] || 0;
  S.boxes[c.key] = r === 0 ? 0 : r === 1 ? Math.max(1, box) : Math.min(5, box + 1);
  if (r === 0 && !FC.again.has(c.key)) { FC.again.add(c.key); FC.deck.splice(Math.min(FC.deck.length, FC.i + 4), 0, c); }
  FC.seen++; FC.i++; FC.flipped = false;
  touchStreak(); save(); drawCard();
}

/* ---- generic multiple-choice runner (topic quiz, mistakes, units) ---- */
let QZ = null;
function runQuiz(items, opts) {
  QZ = { items: items.map(it => { const order = shuffle([0, 1, 2, 3].slice(0, it.options.length)); return Object.assign({}, it, { order }); }), i: 0, score: 0, picked: null, wrong: [], opts: opts || {} };
  drawQ();
}
function drawQ() {
  const it = QZ.items[QZ.i];
  if (!it) return quizEnd();
  const t = it.topic && topicById[it.topic];
  const answered = QZ.picked != null;
  const right = answered && QZ.picked === it.answer;
  app.innerHTML = `
    <div class="row between"><span class="muted" style="font-size:.85rem">${esc(QZ.opts.title || "Quiz")} · question ${QZ.i + 1} of ${QZ.items.length} ${t ? `· <span class="badge topic">${SL}${t.num} ${esc(t.name)}</span>` : ""} ${it.ho ? '<span class="badge">HIGHER</span>' : ""}</span>
      <span class="mono muted" style="font-size:.85rem">${QZ.score} correct</span></div>
    <div class="progress"><i style="width:${100 * QZ.i / QZ.items.length}%"></i></div>
    <h2 style="font-size:1.15rem">${esc(it.q)}</h2>
    <div class="options">
      ${it.order.map((oi, n) => {
        let cls = "";
        if (answered && oi === it.answer) cls = "right";
        else if (answered && oi === QZ.picked) cls = "wrong";
        return `<button class="opt ${cls}" data-o="${oi}" ${answered ? "disabled" : ""}><span class="k">${"ABCD"[n]}</span><span>${esc(it.options[oi])}</span></button>`;
      }).join("")}
    </div>
    ${answered ? `<div class="feedback ${right ? "good" : "bad"}"><b>${right ? "Correct" : "Not quite. The answer is " + esc(it.options[it.answer])}</b>${esc(it.why || "")}</div>
      <div class="row"><button class="primary" id="q-next">${QZ.i + 1 < QZ.items.length ? "Next question" : "See results"}</button><span class="kbd">Enter</span></div>` : `<span class="kbd">Press A–D or 1–4</span>`}`;
  app.querySelectorAll("[data-o]").forEach(b => b.onclick = () => answerQ(+b.dataset.o));
  const nx = document.getElementById("q-next"); if (nx) { nx.onclick = nextQ; nx.focus(); }
  setKeys(e => {
    if (QZ.picked == null) {
      const n = "1234".indexOf(e.key) >= 0 ? "1234".indexOf(e.key) : "abcd".indexOf(e.key.toLowerCase());
      if (n >= 0 && n < it.order.length && e.key.length === 1) answerQ(it.order[n]);
    } else if (e.key === "Enter") { e.preventDefault(); nextQ(); }
  });
}
function answerQ(o) {
  const it = QZ.items[QZ.i];
  QZ.picked = o;
  const ok = o === it.answer;
  if (ok) QZ.score++; else QZ.wrong.push(it);
  if (QZ.opts.onAnswer) QZ.opts.onAnswer(it, ok);
  touchStreak(); save(); drawQ();
}
function nextQ() { QZ.picked = null; QZ.i++; drawQ(); }
function quizEnd() {
  setKeys(null);
  const n = QZ.items.length;
  app.innerHTML = `<div class="empty"><div class="eyebrow">${esc(QZ.opts.title || "Quiz")} finished</div>
      <h2 style="font-size:2rem;margin-top:6px" class="mono">${QZ.score} / ${n}</h2><p>${pct(QZ.score, n)}%${pct(QZ.score, n) >= 80 ? " · strong work" : pct(QZ.score, n) >= 50 ? " · getting there" : " · worth another go after the flashcards"}</p></div>
    ${QZ.wrong.length ? `<div><h3>To go back over</h3><ol class="mistake-list">${QZ.wrong.map(w => `<li><b>${esc(w.q)}</b><br><span class="muted">${esc(w.options[w.answer])}</span></li>`).join("")}</ol></div>` : ""}
    <div class="row"><button class="primary" id="q-again">${esc(QZ.opts.againLabel || "New quiz")}</button><a class="btn" href="#home" style="text-decoration:none">Back to overview</a></div>`;
  document.getElementById("q-again").onclick = () => (QZ.opts.again || views.quiz)();
}
function recordTopic(it, ok) {
  const q = S.quiz[it.topic] = S.quiz[it.topic] || { r: 0, t: 0 };
  q.t++; if (ok) q.r++;
  if (!ok && !S.mistakes.includes(it.key)) S.mistakes.push(it.key);
  if (ok && S.mistakes.includes(it.key)) S.mistakes = S.mistakes.filter(k => k !== it.key);
}

/* ---- quiz view ---- */
let quizLen = 10;
views.quiz = function () {
  setKeys(null); QZ = null;
  const pool = allMcq(selTopics());
  app.innerHTML = `<div><div class="eyebrow">Exam-style multiple choice</div><h2>Quiz</h2></div>
    ${chipsHTML()}
    <div class="row"><span class="muted">Questions:</span>
      ${[10, 20].map(n => `<button class="chip" data-len="${n}" aria-pressed="${quizLen === n}">${n}</button>`).join("")}
      <span class="muted" style="font-size:.85rem">${pool.length} in the selected topics</span></div>
    <div class="row"><button class="primary" id="q-start" ${pool.length ? "" : "disabled"}>Start quiz</button>
      <button id="q-mist" ${subjMistakes().length ? "" : "disabled"}>Review mistakes (${subjMistakes().length})</button>
      ${hasUnitsQuiz() ? '<button id="q-units">Units quiz</button>' : ""}</div>
    <p class="muted" style="font-size:.88rem">Questions you get wrong are saved to Review mistakes. Get one right there and it drops off the list.</p>`;
  bindChips(views.quiz);
  app.querySelectorAll("[data-len]").forEach(b => b.onclick = () => { quizLen = +b.dataset.len; views.quiz(); });
  document.getElementById("q-start").onclick = () => runQuiz(shuffle(pool).slice(0, quizLen), { title: "Quiz", onAnswer: recordTopic, again: views.quiz });
  document.getElementById("q-mist").onclick = startMistakes;
  const qu = document.getElementById("q-units"); if (qu) qu.onclick = startUnits;
};
function startMistakes() {
  const items = subjMistakes().map(mcqByKey).filter(Boolean);
  if (!items.length) return views.quiz();
  runQuiz(shuffle(items).slice(0, 20), { title: "Mistakes review", onAnswer: recordTopic, again: () => subjMistakes().length ? startMistakes() : views.quiz(), againLabel: "Review again" });
}
function unitsPool() {
  const seen = new Map();
  (D.equations || []).forEach(e => (e.symbols || []).forEach(s => { const name = String(s[1]).toLowerCase(); if (s[2] && !seen.has(name)) seen.set(name, { name: s[1], unit: s[2], topic: e.topic }); }));
  return [...seen.values()];
}
function hasUnitsQuiz() { return new Set(unitsPool().map(x => x.unit)).size >= 4; }
function startUnits() {
  const seen = new Map();
  (D.equations || []).forEach(e => (e.symbols || []).forEach(s => { const name = String(s[1]).toLowerCase(); if (s[2] && !seen.has(name)) seen.set(name, { name: s[1], unit: s[2], topic: e.topic }); }));
  const list = [...seen.values()];
  const units = [...new Set(list.map(x => x.unit))];
  if (units.length < 4) return;
  const items = shuffle(list).slice(0, 10).map(x => {
    const opts = [x.unit].concat(shuffle(units.filter(u => u !== x.unit)).slice(0, 3));
    return { q: "What is the SI unit of " + x.name + "?", options: opts, answer: 0, why: x.name.charAt(0).toUpperCase() + x.name.slice(1) + " is measured in " + x.unit + "." };
  });
  runQuiz(items, { title: "Units quiz", again: startUnits, againLabel: "Another units quiz" });
}

}

  setKeys(null);
  if (!CQ || !selTopics().includes(CQ.G.topic)) newCalc();
  drawCalc();
};
function drawCalc() {
  const head = `<div><div class="eyebrow">Unlimited practice with fresh numbers</div><h2>Calculations</h2></div>${chipsHTML()}
    <label class="check"><input type="checkbox" id="conv" ${S.conv ? "checked" : ""}> Mix in unit conversions (g, cm, kJ, mA, minutes…)</label>`;
  if (!CQ) { app.innerHTML = head + `<p class="empty">No calculation practice for these topics. Use the flashcards and quiz for them.</p>`; bindCalcHead(); return; }
  const { G, target } = CQ;
  const tv = G.vars[target];
  const t = topicById[G.topic];
  const unitTxt = tv.u ? tv.u : "no unit";
  let fb = "";
  if (CQ.result) {
    const conv = CQ.givens.filter(x => x.conv);
    const steps = [
      `Equation: <span class="mono">${esc(G.eq)}</span>`,
      target !== G.out ? `Rearrange: <span class="mono">${esc(G.re[target])}</span>` : "",
      conv.length ? `Convert units: ${conv.map(x => `${esc(fmt(x.val))} ${esc(x.unit)} = ${esc(fmt(x.val * G.vars[x.k].alt.f))} ${esc(x.si)}`).join("; ")}` : "",
      `Substitute: <span class="mono">${CQ.givens.map(x => `${esc(symOf(x.k))} = ${esc(fmt(x.conv ? x.val * G.vars[x.k].alt.f : x.val))}${x.si ? " " + esc(x.si) : ""}`).join(", ")}</span>`,
      `Answer: <span class="mono">${esc(symOf(target))} = ${esc(fmt(CQ.answer))}${tv.u ? " " + esc(tv.u) : ""}</span>`
    ].filter(Boolean);
    const cls = CQ.result === "right" ? "good" : "bad";
    const title = CQ.result === "right" ? "Correct" : CQ.result === "shown" ? "Worked answer" : CQ.result === "power" ? "Right digits, wrong size. Check your unit conversions." : "Not quite";
    fb = `<div class="feedback ${cls}"><b>${title}</b><ol class="steps">${steps.map(s => `<li>${s}</li>`).join("")}</ol></div>`;
  }
  app.innerHTML = head + `
    <div class="row between"><span><span class="badge topic">${SL}${t.num} ${esc(t.name)}</span> ${G.ho ? '<span class="badge">HIGHER</span>' : ""}</span>
      <span class="mono muted" style="font-size:.85rem">${S.calc.r}/${S.calc.t} right</span></div>
    <h3>${esc(G.name)}</h3>
    <p>Calculate the <b>${esc(tv.n)}</b>${tv.u ? ` in <b>${esc(tv.u)}</b>` : ""}.</p>
    <ul class="givens">${CQ.givens.map(x => `<li><span>${esc(x.n)}${x.constant ? " (take as)" : ""}</span><span class="val">${esc(fmt(x.val))}${x.unit ? " " + esc(x.unit) : ""}</span></li>`).join("")}</ul>
    <div class="answer-row">
      <input id="ans" inputmode="decimal" autocomplete="off" placeholder="your answer" value="${esc(CQ.input)}" ${CQ.result ? "disabled" : ""} aria-label="Your answer in ${esc(unitTxt)}">
      <span class="unit">${esc(unitTxt)}</span>
      ${CQ.result ? `<button class="primary" id="c-next">Next question</button>` : `<button class="primary" id="c-check">Check</button><button class="ghost" id="c-show">Show answer</button>`}
    </div>
    ${CQ.result ? "" : `<div class="row"><button class="chip" data-ins="−">− minus</button><button class="chip" data-ins="×10^">× 10ⁿ</button><button class="chip" data-ins="clear">Clear</button></div>`}
    ${fb}
    <p class="muted" style="font-size:.82rem">Answers within 2% count, so rounding to 2 or 3 significant figures is fine. Type powers of ten as 3.2e5 or 3.2x10^5.</p>`;
  bindCalcHead();
  const ans = document.getElementById("ans");
  const chk = document.getElementById("c-check");
  if (chk) {
    chk.onclick = checkCalc;
    document.getElementById("c-show").onclick = () => { CQ.result = "shown"; S.calc.t++; save(); drawCalc(); };
    ans.onkeydown = e => { if (e.key === "Enter") checkCalc(); };
    ans.oninput = () => { CQ.input = ans.value; };
    app.querySelectorAll("[data-ins]").forEach(b => b.onclick = () => {
      const s = b.dataset.ins;
      ans.value = s === "clear" ? "" : s === "−" ? (ans.value.startsWith("-") ? ans.value.slice(1) : "-" + ans.value) : ans.value + "x10^";
      CQ.input = ans.value; ans.focus();
    });
    if (window.matchMedia("(hover: hover)").matches) ans.focus();
  }
  const nx = document.getElementById("c-next");
  if (nx) { nx.onclick = () => { newCalc(); drawCalc(); }; nx.focus(); setKeys(e => { if (e.key === "Enter" && e.target.id !== "ans") { e.preventDefault(); newCalc(); drawCalc(); } }); }
}
function bindCalcHead() {
  bindChips(() => { newCalc(); drawCalc(); });
  document.getElementById("conv").onchange = e => { S.conv = e.target.checked; save(); newCalc(); drawCalc(); };
}
function checkCalc() {
  const ans = document.getElementById("ans");
  const x = parseNum(ans.value);
  if (isNaN(x)) { ans.setCustomValidity("Type a number"); ans.reportValidity(); return; }
  CQ.input = ans.value;
  const a = CQ.answer;
  const close = (p, q) => Math.abs(p - q) <= 0.02 * Math.abs(q);
  let res = close(x, a) ? "right" : "wrong";
  if (res === "wrong" && [1e3, 1e-3, 1e2, 1e-2, 1e6, 1e-6, 60, 1 / 60, 100, 0.01].some(k => close(x, a * k))) res = "power";
  CQ.result = res;
  S.calc.t++; if (res === "right") S.calc.r++;
  touchStreak(); save(); drawCalc();
}

/* ---- equations ---- */
let eqHide = false;
views.equations = function () {
  setKeys(null);
  const ids = selTopics();
  const eqs = (D.equations || []).filter(e => ids.includes(e.topic));
  const groups = ids.map(id => ({ t: topicById[id], list: eqs.filter(e => e.topic === id) })).filter(gr => gr.list.length);
  app.innerHTML = `<div class="row between"><div><div class="eyebrow">${esc(SUBJ.name)} ${S.subject === "physics" ? "equations list" : "key formulae"}</div><h2>${S.subject === "physics" ? "Equations" : "Formulae"}</h2></div>
      <div class="row"><label class="check"><input type="checkbox" id="eqhide" ${eqHide ? "checked" : ""}> Test me: hide the equations</label>${hasUnitsQuiz() ? '<button id="eq-units">Units quiz</button>' : ""}</div></div>
    ${chipsHTML()}
    <p class="muted" style="font-size:.88rem">${S.subject === "physics" ? "Some of these you must learn and some are printed on the equation sheet in the exam. Check with your teacher which is which, and learn the units for all of them." : "Learn each formula and the units that go with it."} With “Test me” on, say it out loud, then tap to check.</p>
    ${groups.length ? groups.map(gr => `<div><h3 style="margin-bottom:4px">${SL}${gr.t.num} ${esc(gr.t.name)}</h3>
      ${gr.list.map(e => `<div class="eq-item">
        <div><div style="font-weight:600">${esc(e.name)} ${e.ho ? '<span class="badge">HIGHER</span>' : ""}</div><div class="e ${eqHide ? "hidden" : ""}" tabindex="0" role="button" aria-label="Show equation">${esc(e.eq)}</div></div>
        <div class="sym"><div>${esc(e.words || "")}</div>${(e.symbols || []).map(s => `<div><span class="mono">${esc(s[0])}</span> ${esc(s[1])}${s[2] ? `, <span class="mono">${esc(s[2])}</span>` : ""}</div>`).join("")}</div>
      </div>`).join("")}</div>`).join("") : `<p class="empty">Nothing for these topics.</p>`}`;
  bindChips(views.equations);
  document.getElementById("eqhide").onchange = e => { eqHide = e.target.checked; views.equations(); };
  const eu = document.getElementById("eq-units"); if (eu) eu.onclick = () => { location.hash = "quiz"; setTimeout(startUnits, 0); };
  app.querySelectorAll(".e").forEach(el => { const tg = () => el.classList.toggle("hidden"); el.onclick = tg; el.onkeydown = ev => { if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); tg(); } }; });
};

/* ---- practicals ---- */
views.practicals = function () {
  setKeys(null);
  const list = D.practicals || [];
  app.innerHTML = `<div><div class="eyebrow">The ${list.length} you need to know for ${esc(SUBJ.name)}</div><h2>Required practicals</h2></div>
    <p class="muted" style="font-size:.88rem">Exam questions ask you to describe the method, name the variables, spot errors and suggest improvements. Open each one and cover the method to test yourself.</p>
    <div style="display:flex;flex-direction:column;gap:8px">
    ${list.map((p, i) => { const t = topicById[p.topic]; return `<details class="prac">
      <summary><span>${i + 1}. ${esc(p.name)}</span>${t ? `<span class="badge topic">${SL}${t.num}</span>` : ""}</summary>
      <div class="body">
        <p><b>Aim:</b> ${esc(p.aim)}</p>
        <div><b>Method</b><ol>${(p.method || []).map(s => `<li>${esc(s)}</li>`).join("")}</ol></div>
        <dl class="vars"><dt>IV</dt><dd>${esc(p.iv)}</dd><dt>DV</dt><dd>${esc(p.dv)}</dd><dt>CV</dt><dd>${esc(p.cv)}</dd></dl>
        ${p.safety ? `<p><b>Safety:</b> ${esc(p.safety)}</p>` : ""}
        ${(p.tips || []).length ? `<div><b>Exam tips</b><ul>${p.tips.map(s => `<li>${esc(s)}</li>`).join("")}</ul></div>` : ""}
      </div></details>`; }).join("")}</div>`;
};

/* ---------- router ---------- */
function route() {
  let h = location.hash.replace("#", "") || "home";
  if (!views[h]) h = "home";
  document.querySelectorAll("#tabs a").forEach(a => a.setAttribute("aria-current", a.getAttribute("href") === "#" + h ? "page" : "false"));
  if (h !== "cards") FC = null;
  views[h]();
}
window.addEventListener("hashchange", route);
document.querySelectorAll("#subjects [data-subj]").forEach(b => b.onclick = () => {
  if (b.dataset.subj === S.subject) return;
  setSubject(b.dataset.subj); FC = null; QZ = null; CQ = null; save(); route();
});
setSubject(S.subject);
if (!TOPICS.length) app.innerHTML = '<p class="empty">The question bank did not load. Refresh the page to try again.</p>';
else route();
drawStreak();
})();
</script>
